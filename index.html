<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090708">
  <meta name="description" content="Schwanensee · Braunschweig · 1998–2024">
  <title>Schwanensee · Braunschweig</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room">
    <div class="glow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section class="welcome" aria-label="Schwanensee">
      <div class="years">1998 – 2024</div>
      <img class="logo" src="logo.png" alt="Schwanensee Diskothek">

      <div class="contact">
        <div class="contact-intro">Du willst uns etwas erzählen? Dann schreib uns.</div>
        <a class="mail" href="mailto:feiern@schwanensee-braunschweig.de">feiern@schwanensee-braunschweig.de</a>
      </div>
    </section>
  </main>

<script>
  if (Math.random() < 0.5) {
    const egg = document.createElement('img');
    egg.className = 'easter-egg';
    egg.src = 'easter-egg.png';
    egg.alt = '';
    egg.setAttribute('aria-hidden', 'true');
    document.querySelector('main').appendChild(egg);
  }
</script>
</body>
</html>
